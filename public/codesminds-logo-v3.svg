<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" width="720" height="220" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2F6FFF"/>
      <stop offset="100%" stop-color="#00C2FF"/>
    </linearGradient>
  </defs>

  <!-- ICON: rounded square badge with interlocked C + M monogram -->
  <g transform="translate(20,30)">
    <rect x="0" y="0" width="150" height="150" rx="34" fill="#12121A" stroke="url(#accentGrad)" stroke-width="2"/>
    <!-- C stroke arc -->
    <path d="M 108 40
             A 46 46 0 1 0 108 112"
          fill="none" stroke="url(#accentGrad)" stroke-width="16" stroke-linecap="round"/>
    <!-- M as two angled strokes nested inside the C, in white -->
    <path d="M 46 100 L 46 56 L 75 84 L 104 56 L 104 100"
          fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- small accent spark / cursor dot, top-right -->
    <circle cx="122" cy="30" r="7" fill="url(#accentGrad)"/>
  </g>

  <!-- WORDMARK (white text for dark backgrounds) -->
  <g transform="translate(195,0)">
    <text x="0" y="105" font-family="Arial, Helvetica, sans-serif" font-weight="800"
          font-size="72" letter-spacing="2" fill="#FFFFFF">CODES</text>
    <text x="211" y="105" font-family="Arial, Helvetica, sans-serif" font-weight="800"
          font-size="72" letter-spacing="2" fill="url(#accentGrad)">MINDS</text>

    <!-- tagline row with diamond separators -->
    <g transform="translate(2,150)">
      <polygon points="0,-4 4,0 0,4 -4,0" fill="url(#accentGrad)"/>
      <text x="16" y="4" font-family="Georgia, 'Times New Roman', serif" font-style="italic"
            font-size="21" fill="#A8A8B3">Building Smart Digital Solutions</text>
      <polygon points="400,-4 404,0 400,4 396,0" fill="url(#accentGrad)"/>
    </g>
  </g>
</svg>
